name: Build CaptureSecureScreen Patched APK
on:
  push:
    branches: [build/capture-secure-apk-20261027]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out patch files
        uses: actions/checkout@v4
      - name: Clone original upstream project
        run: git clone --depth 1 https://github.com/jimmychanii/CaptureSecureScreen.git source
      - name: Apply startup stability and saved-file patches
        run: |
          cp capturefix/MainActivity.java source/app/src/main/java/com/xgs/cap/MainActivity.java
          cp capturefix/CaptureService.java source/app/src/main/java/com/xgs/cap/CaptureService.java
          sed -i 's/versionCode 2/versionCode 4/; s/versionName "2.1"/versionName "2.3"/' source/app/build.gradle
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          test -s source/app/build/outputs/apk/debug/app-debug.apk
          unzip -t source/app/build/outputs/apk/debug/app-debug.apk | tail -1
          sha256sum source/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CaptureSecureScreen-patched-v2.3-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
