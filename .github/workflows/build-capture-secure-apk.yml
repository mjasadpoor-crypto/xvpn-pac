name: Build CaptureSecureScreen APK
on:
  push:
    branches: [build/capture-secure-apk-20261027]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Clone upstream project
        run: git clone --depth 1 https://github.com/jimmychanii/CaptureSecureScreen.git source
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CaptureSecureScreen-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
